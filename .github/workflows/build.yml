name: Build
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --name AnugrahKeuangan anugrah_keuangan.py
      - run: choco install innosetup -y --no-progress
      - name: Compile installer
        shell: pwsh
        run: |
          $v = "${{ github.event.release.tag_name }}".TrimStart("v")
          if (-not $v) { $v = "1.0.0" }
          "VER=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVer=$v" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: output/AnugrahKeuangan-Setup-${{ env.VER }}.exe
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: output/AnugrahKeuangan-Setup-${{ env.VER }}.exe
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Pakai kunci tanda tangan tetap
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Set version
        run: |
          V="${{ github.event.release.tag_name }}"
          V="${V#v}"
          V="${V:-1.0.0}"
          echo "VER=$V" >> "$GITHUB_ENV"
          sed -i "s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - run: npx cap sync android
      - run: |
          cd android && chmod +x gradlew
          ./gradlew assembleDebug \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/mobile/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
      - name: Periksa sidik jari tanda tangan APK
        continue-on-error: true
        run: |
          AS=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* | sort -V | tail -1)/apksigner
          SHA=$("$AS" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-1 digest" | head -1 | sed 's/.*: //' | tr -d ':' | tr 'A-F' 'a-f')
          EXP=672d849241725fa18fa57b7c7cb0f369dda844f5
          KS=$(keytool -list -v -keystore debug.keystore -storepass android 2>/dev/null | grep "SHA1:" | head -1 | sed 's/.*SHA1: //' | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$SHA" ]; then HASIL="Tidak bisa membaca sidik jari APK"; elif [ "$SHA" = "$EXP" ]; then HASIL="COCOK dengan client Android di Google Cloud"; else HASIL="TIDAK COCOK - login Google akan gagal"; fi
          echo "SHA-1 APK        : $SHA"
          echo "SHA-1 di Google  : $EXP"
          echo "SHA-1 keystore repo: $KS"
          echo "Hasil            : $HASIL"
          { echo "### Sidik jari tanda tangan APK"; echo "- SHA-1 APK: \`$SHA\`"; echo "- SHA-1 keystore di repo: \`$KS\`"; echo "- SHA-1 di Google Cloud: \`$EXP\`"; echo "- **$HASIL**"; } >> "$GITHUB_STEP_SUMMARY"
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk AnugrahKeuangan-${{ env.VER }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-android
          path: mobile/AnugrahKeuangan-${{ env.VER }}.apk
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: mobile/AnugrahKeuangan-${{ env.VER }}.apk
